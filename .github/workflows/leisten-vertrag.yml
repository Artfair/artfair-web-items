# Leisten-Vertrag (CLAUDE.md) bei jedem PR und jedem Push auf main prüfen.
name: Leisten-Vertrag
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run pruefen
